# App runtipi (schéma 2). Runtipi ne construit pas d'image : construis-la sur le serveur avant d'installer,
# puis après chaque mise à jour du code : docker build -t second-brain-v2:latest <dépôt>
services:
  second-brain:
    image: second-brain-v2:latest
    pull_policy: never
    restart: unless-stopped
    # L'utilisateur de runtipi : il possède le dossier de données que runtipi crée.
    user: ${UID}:${GID}
    environment:
      - APP_PASSWORD=${SECOND_BRAIN_PASSWORD}
      - SESSION_SECRET=${SECOND_BRAIN_SESSION_SECRET}
      - DATA_SOURCE=${SECOND_BRAIN_DATA_SOURCE:-live}
      - HOME_TIMEZONE=${TZ:-Europe/Paris}
      # Chemins sur le serveur dans le formulaire ; le conteneur les voit en /vault et /captures.
      - OBSIDIAN_VAULT=${SECOND_BRAIN_VAULT:+/vault}
      - OBSIDIAN_CAPTURES=${SECOND_BRAIN_CAPTURES:+/captures}
      - IMMICH_URL=${SECOND_BRAIN_IMMICH_URL:-}
      - IMMICH_API_KEY=${SECOND_BRAIN_IMMICH_API_KEY:-}
      - TRAKT_CLIENT_ID=${SECOND_BRAIN_TRAKT_CLIENT_ID:-}
      - CALENDAR_ICS_URLS=${SECOND_BRAIN_CALENDAR_ICS_URLS:-}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      # Sans chemin, `/dev/null` évite à Docker de créer un dossier vide sur le serveur.
      - ${SECOND_BRAIN_VAULT:-/dev/null}:/vault:ro
      - ${SECOND_BRAIN_CAPTURES:-/dev/null}:/captures
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
